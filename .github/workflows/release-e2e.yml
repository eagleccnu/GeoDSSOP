name: released-weight-regression

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Download frozen W3 weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.0 --dir checkpoints --pattern "*.safetensors"
      - name: Run end-to-end regression
        env:
          GEODSSOP_TEST_WEIGHTS: checkpoints
          GEODSSOP_TEST_DEVICE: cpu
        run: pytest -m e2e
